[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "canonical-coordinate-system"
version = "4.0.0"
description = "A reference coordinate datum for the tree of life (frozen frame + registration) with an operational retrieval engine"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Rohit Fenn", email = "rohit@sentry.bio"},
    {name = "Amit Fenn"},
]
keywords = [
    "bioinformatics", "genomics", "phylogenetics", "hyperbolic-geometry",
    "poincare-ball", "voronoi-tessellation", "canonical-coordinates",
    "coordinate-system", "taxonomy", "metagenomics",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
build = ["scikit-learn>=1.3"]
benchmark = ["scikit-learn>=1.3", "torch>=2.0", "scipy>=1.10"]
dev = ["pytest>=7", "scikit-learn>=1.3"]

[project.urls]
Homepage = "https://biosphereatlas.com"
Repository = "https://github.com/sentry-bio/canonical-coordinate-system"
Documentation = "https://biosphereatlas.com/docs/ccs"

[tool.setuptools.packages.find]
include = ["canonical_datum*", "canonical_hybrid*"]
